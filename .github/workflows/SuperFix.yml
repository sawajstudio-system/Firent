name: SuperFix

on:
  workflow_dispatch:

jobs:
  superfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: "1. Checkout Public Repo"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: "2. Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "3. Install deps"
        run: pip install requests

      - name: "4. Start Notification"
        run: |
          python -c "
          import os, requests
          tok, chat = os.getenv('TG_TOKEN'), os.getenv('TG_CHAT')
          if tok and chat:
              try:
                  requests.post(f'https://api.telegram.org/bot{tok}/sendMessage',
                      json={'chat_id': chat, 'text': '🚀 SuperFix started...'}, timeout=10)
              except Exception as e:
                  print(f'Telegram skipped: {e}')
          "

      - name: "5. Clone Private Backend"
        run: |
          set -e
          echo "→ Cloning private repo..."
          if [ -z "$TOKEN_GITHUB" ]; then
            echo "❌ TOKEN_GITHUB EMPTY!"
            exit 1
          fi
          git clone https://$TOKEN_GITHUB@github.com/sawajstudio-system/Backend.git "$GITHUB_WORKSPACE/temp_private"
          echo "✅ Clone OK"
          ls -la "$GITHUB_WORKSPACE/temp_private" | head -10

      - name: "6. Config Private Git"
        run: |
          cd "$GITHUB_WORKSPACE/temp_private"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Branch: $(git branch --show-current)"
          echo "Last: $(git log -1 --oneline)"

      - name: "7. Move Files into System_room"
        run: |
          cd "$GITHUB_WORKSPACE/temp_private"

          if [ -f "create.py" ] && [ ! -f "System_room/create.py" ]; then
            git mv create.py System_room/create.py
            echo "✅ Moved create.py"
          else
            echo "⏭️ create.py skipped"
          fi

          if [ -f "README.md" ] && [ ! -f "System_room/README.md" ]; then
            git mv README.md System_room/README.md
            echo "✅ Moved README.md"
          else
            echo "⏭️ README.md skipped"
          fi

          if [ -d "service_api" ] && [ ! -d "System_room/service_api" ]; then
            git mv service_api System_room/service_api
            echo "✅ Moved service_api/"
          else
            echo "⏭️ service_api skipped"
          fi

          echo ""
          echo "System_room contents:"
          ls -la System_room/

      - name: "8. Rewrite PY Files"
        run: |
          cd "$GITHUB_WORKSPACE/temp_private"
          python "$GITHUB_WORKSPACE/superfix.py"

      - name: "9. Commit & Push Private"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/temp_private"
          git add -A
          if git diff --staged --quiet; then
            echo "⚠️ No changes in private repo"
          else
            git commit -m "SuperFix: files moved to System_room/, PY paths fixed"
            git push origin HEAD
            echo "✅ Private repo pushed"
          fi

      - name: "10. Update Public System.yml"
        run: |
          cd "$GITHUB_WORKSPACE"
          python "$GITHUB_WORKSPACE/superfix_public.py"

      - name: "11. Commit & Push Public"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/System*.yml
          if git diff --staged --quiet; then
            echo "⚠️ No changes in public repo"
          else
            git commit -m "SuperFix: System.yml PYTHONPATH updated"
            git push origin HEAD
            echo "✅ Public repo pushed"
          fi

      - name: "12. Cleanup"
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/temp_private" || true
          echo "✅ Cleanup done"

      - name: "13. Final Notification"
        if: always()
        run: |
          python -c "
          import os, requests
          tok, chat = os.getenv('TG_TOKEN'), os.getenv('TG_CHAT')
          status = '${{ job.status }}'
          if tok and chat:
              try:
                  requests.post(f'https://api.telegram.org/bot{tok}/sendMessage',
                      json={'chat_id': chat, 'text': f'🎉 SuperFix done!\nStatus: {status}'}, timeout=10)
              except Exception as e:
                  print(f'Telegram skipped: {e}')
          "
